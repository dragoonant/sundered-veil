<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starbound Legions</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="status"></span>
    <span id="turn-buttons"></span>
    <button id="undo-btn">Undo</button>
    <select id="deck-select"></select>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="mid" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game-btn">New game</button>
    <button id="help-btn">How to play</button>
  </div>
  <div id="main">
  <div id="board">
    <!-- The mat art paints every zone's outline and its label, so the DOM carries no
         label text of its own: each .mat-zone is positioned onto its painted slot by
         percentage in styles.css. Order here is reading order, not layout order. -->
    <div id="mat">
      <div id="enemy-deck" class="mat-zone pile-slot"></div>
      <div id="enemy-discard" class="mat-zone pile-slot"></div>
      <div id="enemy-res" class="mat-zone res-slot"></div>
      <div id="enemy-base" class="mat-zone base-slot"></div>
      <div id="enemy-leader" class="mat-zone leader-slot"></div>

      <div id="arena-ground" class="mat-zone arena"></div>
      <div id="arena-space" class="mat-zone arena"></div>

      <div id="my-base" class="mat-zone base-slot"></div>
      <div id="my-leader" class="mat-zone leader-slot"></div>
      <div id="my-deck" class="mat-zone pile-slot"></div>
      <div id="my-discard" class="mat-zone pile-slot"></div>
      <div id="my-res" class="mat-zone res-slot"></div>
    </div>
    <!-- Their hand is the one count the mat has no slot for — it is not a board zone. -->
    <div id="enemy-hand-line">Their hand: <span id="enemy-hand-count"></span></div>
    <div id="choice-bar"></div>
    <div id="mulligan-bar" style="display:none">
      <button id="keep-btn">Keep hand</button>
      <button id="mull-btn">Mulligan</button>
    </div>
    <div id="hand-bar">
      <div id="hand"></div>
      <button id="decline-btn" style="display:none">Done</button>
    </div>
  </div>
  <div id="side">
    <!-- Current state (§8) sits above history (§5); faces (§7) between them, because a
         log line is not a card and an animation is gone the moment you look away. -->
    <div id="prompt" class="prompt"></div>
    <div id="battle-line" class="battle-line" style="display:none"></div>
    <div id="recent-wrap">
      <div class="side-title">Recently played</div>
      <div id="recent"></div>
    </div>
    <div id="log"></div>
  </div>
  </div>
  <!-- §13: options the board does not draw. Peek pushes it aside without answering. -->
  <div id="choice-modal"></div>
  </div>
</div>
<!-- Load order matters (dependency order); mirror of tests.html plus UI files.
     A new data/engine file must be added to BOTH index.html and tests.html. -->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="names.js"></script>
<script src="js/rules.js"></script>
<script src="js/state.js"></script>
<script src="js/effects.js"></script>
<script src="js/engine.js"></script>
<script src="js/text.js"></script>
<script src="js/ops.js"></script>
<script src="js/validate.js"></script>
<script src="data/cards-sor.js"></script>
<script src="data/cards-shd.js"></script>
<script src="data/cards-twi.js"></script>
<script src="data/cards-jtl.js"></script>
<script src="data/cards-lof.js"></script>
<script src="data/cards-sec.js"></script>
<script src="data/cards-law.js"></script>
<script src="data/cards-ash.js"></script>
<script src="data/tokens.js"></script>
<script src="data/decks.js"></script>
<script src="data/names-placeholder.js"></script>
<script src="data/names-1.js"></script>
<script src="data/names-2.js"></script>
<script src="data/names-3.js"></script>
<script src="data/names-4.js"></script>
<!-- Local playtesting only: gitignored source-name/text override, generated by
     tools/gen-source-names.mjs. Absent from the repo and from any deployed build
     (a benign 404 there); deliberately NOT in tests.html, so the text tests keep
     exercising the generated describers. -->
<script src="data/source-local.js"></script>
<script src="js/logtext.js"></script>
<script src="js/sound.js"></script>
<script src="js/boardart.js"></script>
<script src="js/cardview.js"></script>
<script src="js/preview.js"></script>
<script src="js/logpanel.js"></script>
<script src="js/targeting.js"></script>
<script src="js/endvideo.js"></script>
<script src="js/help.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  SB.validateContent();
  const sel = document.getElementById('deck-select');
  Object.keys(SB.decks).filter(function (d) { return d.indexOf('fixture') < 0; }).forEach(function (d) {
    const o = document.createElement('option');
    o.value = d; o.textContent = SB.names.decks[d] || d;
    sel.appendChild(o);
  });
  SB.artUrl = function (cardId) { return 'art/' + cardId + '.png'; };
  SB.cardBackUrl = function () { return 'art/cardback.jpg'; };
  // The board draws itself and places every zone on its own painted slot.
  SB.boardArt.init(document.getElementById('mat'));
  function newGame() {
    SB.sound.reset();
    SB.sound.startAmbience();
    const deck = sel.value;
    const others = Object.keys(SB.decks).filter(function (d) { return d !== deck && d.indexOf('fixture') < 0; });
    const aiDeck = others[Math.floor(Math.random() * others.length)];
    SB.ui.start({ deck0: deck, deck1: aiDeck,
      difficulty: document.getElementById('difficulty-select').value });
  }
  document.getElementById('new-game-btn').onclick = newGame;
  document.getElementById('undo-btn').onclick = function () { SB.ui.undo(); };
  document.getElementById('help-btn').onclick = function () { SB.help.open(); };
  newGame();
})();
</script>
</body>
</html>
